<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8862E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="增重记录">
<title>增重营养记录</title>
<style>
:root{
  --bg:#F5F2ED; --card:#FFFFFF; --text:#2E2A25; --text2:#8C857C; --line:#EBE6DF;
  --primary:#E8862E; --p:#E8862E; --c:#EFC244; --ok:#7FA86B; --warn:#D4674F;
  --p-l:#F5C08A; --c-l:#F6DA9A; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
h1,h2,h3,h4,p{margin:0}
b,strong{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,242,237,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 0 8px}
.topbar .inner{max-width:760px;margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:15px;font-weight:600;letter-spacing:.3px}
.brand span{color:var(--text2);font-weight:400;font-size:12px;margin-left:6px}

/* 日期条 */
.datebar{display:flex;align-items:center;gap:5px;flex:none}
.datebar button{width:30px;height:32px;flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;
  color:var(--primary);font-size:16px;line-height:1;cursor:pointer;white-space:nowrap}
.datebar input[type=date]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 6px;
  font-size:14px;color:var(--text);font-family:inherit;width:126px;min-width:0}
.datebar .today{width:auto;padding:0 9px;font-size:13px;white-space:nowrap}
@media (max-width:430px){
  .topbar .inner{gap:6px}
  .brand span{display:none}
  .brand{font-size:14px;white-space:nowrap}
  .datebar input[type=date]{width:114px;font-size:13.5px}
  .datebar button{width:27px}
  .datebar .today{padding:0 7px;font-size:12.5px}
}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card.wide{grid-column:1 / -1}
.card-label{font-size:12.5px;color:var(--text2)}
.card-value{font-size:24px;font-weight:600;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.card-value small{font-size:12px;font-weight:400;color:var(--text2);margin-left:2px}
.card-sub{font-size:11.5px;color:var(--text2)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tag{font-size:11px;color:var(--primary);background:#FBEEE0;border-radius:6px;padding:1px 6px}
.bar{height:7px;background:#F1EDE7;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--p);transition:width .3s}
.bar.c i{background:var(--c)}
.bar.done i{background:var(--ok)}
.mid{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.mid b{color:var(--text);font-weight:600}
.gap{font-size:12.5px;margin-top:2px}
.gap.need{color:var(--warn)}
.gap.ok{color:var(--ok)}

/* 区块 */
.sec{margin-top:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.sec-head h3{font-size:14px;font-weight:600}
.sec-head .hint{font-size:11.5px;color:var(--text2)}
.sec-head .hint .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#D5D0C8;margin-right:5px;vertical-align:1px}
.sec-head .hint .sync-dot.ok{background:var(--ok)}
.sec-head .hint .sync-dot.err{background:var(--warn)}
.sec-head input.mini-date{border:none;background:transparent;color:var(--text2);font-size:11.5px;font-family:inherit;
  padding:0;width:104px;min-width:0;text-align:right;appearance:none;-webkit-appearance:none;border-radius:0}
.sec-head input.mini-date:focus{outline:none;color:var(--primary)}
.sec-body{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}

/* 餐次 */
.meal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.meal-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 2px;text-align:center;
  cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit}
.meal-tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.meal-tab .m-sub{display:block;font-size:10px;opacity:.85;margin-top:1px;font-variant-numeric:tabular-nums}

/* 表单 */
.row{display:flex;gap:8px;align-items:center}
.row + .row{margin-top:8px}
select,input[type=number],input[type=text],input[type=time],input[type=password],input[type=date]{
  font-family:inherit;font-size:15px;color:var(--text);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%;
  -webkit-appearance:none;appearance:none
}
select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%238C857C'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:26px}
input:focus,select:focus{outline:none;border-color:var(--primary)}
.btn{border:none;background:var(--primary);color:#fff;border-radius:10px;padding:10px 16px;font-size:14.5px;
  font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.85}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--warn)}
.btn.block{width:100%}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #EFC79C;border-radius:12px;padding:10px 10px 11px}
.entry .qty-row{display:grid;grid-template-columns:1fr auto;gap:8px;grid-column:1 / -1}
.entry .entry-title{grid-column:1 / -1;font-size:12px;font-weight:600;color:var(--primary)}
.entry.custom{grid-template-columns:1fr 1fr auto}
.entry.custom .c-name{grid-column:1 / -1}
@media (min-width:560px){
  .entry.custom{grid-template-columns:1.5fr 1fr 1fr auto}
  .entry.custom .c-name{grid-column:auto}
}

/* 记录列表 */
.logs{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.log{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.log:last-child{border-bottom:none}
.log .name{flex:1;min-width:0;font-size:14px}
.log .name em{font-style:normal;color:var(--text2);font-size:12px;margin-left:5px}
.log .nut{font-size:12px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.log .del{width:26px;height:26px;border:none;background:#F6F2EC;color:var(--text2);border-radius:8px;
  font-size:15px;line-height:1;cursor:pointer;flex:none}
.empty{color:var(--text2);font-size:13px;text-align:center;padding:16px 0}

/* 开关 & 部位 */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;background:#E3DED7;border-radius:99px;transition:.2s}
.switch i:after{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;
  top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch input:checked + i{background:var(--primary)}
.switch input:checked + i:after{left:23px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13.5px;
  color:var(--text2);cursor:pointer;font-family:inherit;transition:.15s}
.chip.on{background:#FBEEE0;border-color:var(--primary);color:var(--primary);font-weight:500}
.chips.off{opacity:.45;pointer-events:none}

/* 睡眠 */
.sleep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.info-btn{width:18px;height:18px;border-radius:50%;border:1px solid var(--text2);background:#fff;
  color:var(--text2);font-size:11px;line-height:1;cursor:pointer;padding:0;font-family:inherit;vertical-align:1px}
.notice{margin-top:8px;background:#FAF7F2;border:1px solid var(--line);border-radius:10px;padding:9px 10px;
  font-size:12.5px;color:var(--text2);line-height:1.55}

/* 底部 tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:none;background:none;padding:9px 0 8px;font-size:11.5px;color:var(--text2);cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--primary);font-weight:600}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(24,32,40,.42);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{font-size:15.5px;font-weight:600}
.modal-head .x{border:none;background:none;font-size:20px;color:var(--text2);cursor:pointer;line-height:1;padding:0 2px}
.modal-body{padding:14px 16px;overflow:auto}
.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:none}
.field + .field{margin-top:12px}
.unit-row{display:grid;grid-template-columns:1fr 74px 74px 26px;gap:6px;align-items:center;margin-bottom:7px}
.unit-row input{padding:8px 9px;font-size:14px}
.unit-row .del{border:none;background:#F6F2EC;color:var(--text2);border-radius:8px;height:34px;cursor:pointer;font-size:15px}
.unit-head{display:grid;grid-template-columns:1fr 74px 74px 26px;gap:6px;font-size:11px;color:var(--text2);margin-bottom:4px}
.sub-t{font-size:12px;color:var(--text2);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center}

/* 食物库 */
.food{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.food-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.food-name{font-size:14.5px;font-weight:600}
.food-acts{display:flex;gap:6px;flex:none}
.food-acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;
  color:var(--text2);cursor:pointer;font-family:inherit}
.unit-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unit-tag{font-size:11.5px;color:var(--text2);background:#F7F3ED;border-radius:7px;padding:3px 8px;font-variant-numeric:tabular-nums}
.unit-tag b{color:var(--text);font-weight:600}

/* 统计 */
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input[type=date]{width:auto;flex:1;min-width:126px}
.quicks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quicks button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;
  color:var(--text2);cursor:pointer;font-family:inherit}
.quicks button.on{background:#FBEEE0;border-color:var(--primary);color:var(--primary)}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:12px 0 4px}
.sum{background:#FAF6F1;border-radius:11px;padding:10px 12px}
.sum .t{font-size:11.5px;color:var(--text2)}
.sum .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.sum .s{font-size:11px;color:var(--text2);margin-top:1px}
.chart-box{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 2px;font-size:11.5px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend i.lg-dash{background:transparent;border:1.3px dashed #D5D0C8;box-sizing:border-box}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.tbl th,table.tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl thead th{color:var(--text2);font-weight:500;font-size:12px}
table.tbl tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* 设置 */
.set-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:none}
.set-item .l{font-size:14px}
.set-item .d{font-size:11.5px;color:var(--text2);margin-top:2px}
.set-item .v{font-size:13.5px;color:var(--text2);font-variant-numeric:tabular-nums;text-align:right}
.hist{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hist:last-child{border-bottom:none}
.hist .del{border:none;background:none;color:var(--warn);font-size:12px;cursor:pointer;font-family:inherit}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(34,48,60,.93);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:99px;
  opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand">增重营养记录<span id="brand-sub"></span></div>
    <div class="datebar" id="datebar"></div>
  </div>
</div>

<div class="wrap" id="view"></div>

<nav class="tabbar">
  <div class="inner">
    <button class="tab" data-tab="today" onclick="go('today')">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-tab="foods" onclick="go('foods')">
      <svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M8.5 13h7M8.5 16.5h4.5"/></svg>
      <span>食物库</span>
    </button>
    <button class="tab" data-tab="stats" onclick="go('stats')">
      <svg viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-tab="settings" onclick="go('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M3 12h2.2M18.8 12H21M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
      <span>设置</span>
    </button>
  </div>
</nav>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ============================================================
   增重营养记录 · 单文件应用（无外部依赖）
   数据：localStorage + 可选 GitHub Gist 云同步
   ============================================================ */

const LS_KEY = 'nutri_v1';
const PARTS = ['胸','肩中束','肩后束','肱三头','肱二头','背','腿'];
const PART_COLORS = {'胸':'#EFA45F','肩中束':'#F3BC77','肩后束':'#F2CE7B','肱三头':'#CFD68A','肱二头':'#AFCB96','背':'#9CBEDC','腿':'#BBAFDC'};
/* 图表色板：暖橙主色 + 灰色目标柱，部位色取自参考界面的环图并整体淡化一档 */
const PALETTE = {
  p: '#7FA86B', c: '#EFC244',            // 实际：蛋白质（同首页达标绿）/ 碳水黄
  target: '#D4674F',                     // 目标：红色加粗虚线折线
  sleep: '#E9A469', sleepBar: '#F7E7D7', sleepLab: '#BE7635', // 睡眠：入睡折线 / 时长柱 / 数据标签
  weight: '#DCAE7E', warm: '#E8862E',    // 体重折线 / 称重点
  mean: '#B8AFA4',                       // 均值虚线
  grid: '#F1EDE7', axis: '#E4DFD8', label: '#A69E94', strong: '#7A736B'
};
const MEALS = ['早餐','午餐','晚餐','加餐'];

/* ---------- 工具 ---------- */
const pad2 = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const r1 = n => Math.round(n * 10) / 10;
const fmt = (n, d = 0) => (isFinite(n) ? Number(n).toFixed(d) : '0');

function toStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayStr(){ return toStr(new Date()); }
function addDays(s, n){
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toStr(dt);
}
function md(s){ return s.slice(5).replace('-', '/'); }
function weekdayCn(s){
  const [y,m,d] = s.split('-').map(Number);
  return '日一二三四五六'[new Date(y, m-1, d).getDay()];
}
function daysBetween(a, b){
  const out = [];
  let cur = a, guard = 0;
  while (cur <= b && guard++ < 366) { out.push(cur); cur = addDays(cur, 1); }
  return out;
}

/* ---------- 数据 ---------- */
const DEF_DB = {
  v: 1,
  weights: [],   // [{date, kg}]
  coefs: [],     // [{date, p, c}]
  foods: [],     // [{id, name, units:[{name,p,c}]}]
  logs: [],      // [{id, date, meal, foodId, unit, qty}]
  workouts: [],  // [{date, done, parts:[]}]
  sleeps: [],    // [{date, bedH, bedM, durH}]
  dels: {},      // 删除墓碑 {key: ts}，多端合并时用于同步删除
  meta: {},      // {updatedAt}
  settings: { gistId: '', gistToken: '', autoSync: true }
};

function loadDB(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEF_DB));
    const d = JSON.parse(raw);
    const out = JSON.parse(JSON.stringify(DEF_DB));
    ['weights','coefs','foods','logs','workouts','sleeps'].forEach(k => { if (Array.isArray(d[k])) out[k] = d[k]; });
    if (d.dels && typeof d.dels === 'object') out.dels = d.dels;
    if (d.meta && typeof d.meta === 'object') out.meta = d.meta;
    out.settings = Object.assign({}, DEF_DB.settings, d.settings || {});
    return out;
  } catch(e){ return JSON.parse(JSON.stringify(DEF_DB)); }
}

let DB = loadDB();
let syncTimer = null;

/* ---------- 多端合并（按记录 key 取时间戳较新者，删除用墓碑） ---------- */
const SYNC_COLLS = {
  weights:  r => 'w|' + r.date,
  coefs:    r => 'c|' + r.date,
  foods:    r => 'f|' + r.id,
  logs:     r => 'l|' + r.id,
  workouts: r => 'k|' + r.date,
  sleeps:   r => 's|' + r.date
};
let snap = null;

function stripU(r){ const c = Object.assign({}, r); delete c.u; return c; }

function buildSnap(){
  const out = {};
  Object.keys(SYNC_COLLS).forEach(coll => {
    const kf = SYNC_COLLS[coll], m = {};
    (DB[coll] || []).forEach(r => { m[kf(r)] = JSON.stringify(stripU(r)); });
    out[coll] = m;
  });
  return out;
}

/* 给新增/改动的记录打时间戳；消失的记录写删除墓碑 */
function stampChanges(){
  const now = Date.now();
  if (!snap) snap = buildSnap();
  const next = {};
  DB.dels = DB.dels || {};
  Object.keys(SYNC_COLLS).forEach(coll => {
    const kf = SYNC_COLLS[coll], prev = snap[coll] || {}, m = {};
    (DB[coll] || []).forEach(r => {
      const k = kf(r), s = JSON.stringify(stripU(r));
      if (prev[k] !== s) r.u = now;
      m[k] = s;
    });
    Object.keys(prev).forEach(k => { if (!(k in m)) DB.dels[k] = now; });
    next[coll] = m;
  });
  snap = next;
  DB.meta = DB.meta || {};
  DB.meta.updatedAt = now;
  return now;
}

/* 把远端数据并进本地，返回本地是否被改动 */
function mergeRemote(remote){
  if (!remote || typeof remote !== 'object') return false;
  const dels = Object.assign({}, DB.dels || {});
  Object.keys(remote.dels || {}).forEach(k => {
    dels[k] = Math.max(dels[k] || 0, Number(remote.dels[k]) || 0);
  });

  let changed = false;
  Object.keys(SYNC_COLLS).forEach(coll => {
    const kf = SYNC_COLLS[coll];
    const lmap = {}, rmap = {};
    (DB[coll] || []).forEach(r => { lmap[kf(r)] = r; });
    (remote[coll] || []).forEach(r => { if (r && kf(r)) rmap[kf(r)] = r; });
    const keys = Object.keys(Object.assign({}, lmap, rmap));
    const out = [];
    keys.forEach(k => {
      const l = lmap[k], r = rmap[k];
      let pick = (l && r) ? (((r.u || 0) > (l.u || 0)) ? r : l) : (l || r);
      if (pick && (dels[k] || 0) > (pick.u || 0)) pick = null;
      if (pick) out.push(pick);
      const a = l ? JSON.stringify(stripU(l)) : '';
      const b = pick ? JSON.stringify(stripU(pick)) : '';
      if (a !== b) changed = true;
    });
    if (coll !== 'foods' && coll !== 'logs') out.sort((x, y) => String(x.date || '').localeCompare(String(y.date || '')));
    DB[coll] = out;
  });
  DB.dels = dels;
  DB.meta = DB.meta || {};
  DB.meta.updatedAt = Math.max(DB.meta.updatedAt || 0, Number((remote.meta || {}).updatedAt) || 0);
  if (changed) snap = buildSnap();
  return changed;
}

/* 只比较业务数据，忽略同步元信息 */
function normData(o){
  if (!o) return '';
  return JSON.stringify([
    o.weights || [], o.coefs || [], o.foods || [],
    o.logs || [], o.workouts || [], o.sleeps || [], o.dels || {}
  ]);
}

function saveDB(silent){
  stampChanges();
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast('本地保存失败：' + e.message); }
  if (!silent && DB.settings.autoSync && DB.settings.gistToken) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(true), 1500);
  }
}

function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch(e){}
}

/* ---------- 目标计算 ---------- */
function weightRec(date){
  let hit = null;
  DB.weights.forEach(w => {
    if (w.date <= date && (!hit || w.date > hit.date)) hit = w;
  });
  return hit;
}
function coefRec(date){
  let hit = null;
  DB.coefs.forEach(c => {
    if (c.date <= date && (!hit || c.date > hit.date)) hit = c;
  });
  return hit;
}
function target(date){
  const w = weightRec(date), c = coefRec(date);
  const kg = w ? Number(w.kg) || 0 : 0;
  const cp = c ? Number(c.p) || 0 : 0;
  const cc = c ? Number(c.c) || 0 : 0;
  return { kg, tp: r1(kg * cp), tc: r1(kg * cc), cp, cc, wFrom: w ? w.date : null, cFrom: c ? c.date : null };
}
/* 一条记录的营养：食物库的按「单位营养 × 数量」；临时食物直接用填写的值 */
function logNut(l){
  if (!l) return { p: 0, c: 0 };
  if (!l.foodId) return { p: r1(Number(l.p) || 0), c: r1(Number(l.c) || 0) };
  const f = DB.foods.find(x => x.id === l.foodId);
  if (!f) return { p: 0, c: 0 };
  const u = f.units.find(x => x.name === l.unit);
  if (!u) return { p: 0, c: 0 };
  const q = Number(l.qty) || 0;
  return { p: r1((Number(u.p) || 0) * q), c: r1((Number(u.c) || 0) * q) };
}
function intake(date){
  let p = 0, c = 0;
  DB.logs.forEach(l => { if (l.date !== date) return; const n = logNut(l); p += n.p; c += n.c; });
  return { p: r1(p), c: r1(c) };
}
function mealIntake(date, meal){
  let p = 0, c = 0;
  DB.logs.forEach(l => { if (l.date !== date || l.meal !== meal) return; const n = logNut(l); p += n.p; c += n.c; });
  return { p: r1(p), c: r1(c) };
}
function workoutOf(date){ return DB.workouts.find(w => w.date === date); }
function sleepOf(date){ return DB.sleeps.find(s => s.date === date); }

    +   '<div class="bar' + (t.tp > 0 && i.p >= t.tp ? ' done' : '') + '"><i style="width:' + pPct + '%"></i></div>'
    +   '<div class="gap ' + (pGap > 0 ? 'need' : 'ok') + '">' + (t.tp === 0 ? '请先设置体重与系数' : (pGap > 0 ? '还差 ' + fmt(pGap, 1) + ' g' : '已达成 +' + fmt(-pGap, 1) + ' g')) + '</div>'

    +     '<span class="num" style="font-size:12px;color:var(--text2)">' + (t.tc > 0 ? Math.round(i.c / t.tc * 100) : 0) + '%</span></div>'

function setMeal(m){ state.meal = m; render(); }

function onFoodChange(init){
  const fsel = $('in-food'), usel = $('in-unit');
  if (!fsel || !usel) return;
  const f = DB.foods.find(x => x.id === fsel.value);
  const keep = init ? (state.lastUnit || '') : usel.value;
  usel.innerHTML = (f && f.units.length)
    ? f.units.map(u => '<option value="' + esc(u.name) + '">' + esc(u.name) + ' · ' + u.p + '/' + u.c + 'g</option>').join('')
    : '<option value="">—</option>';
  if (keep) usel.value = keep;
  if (fsel.value) state.lastFood = fsel.value;
}

function addLog(){
  const fid = $('in-food') ? $('in-food').value : '';
  const unit = $('in-unit') ? $('in-unit').value : '';
  const qty = parseFloat($('in-qty').value);
  if (!fid) return toast('请先到食物库添加食物');
  if (!unit) return toast('该食物还没有单位');
  if (!(qty > 0)) return toast('请输入食用量');
  state.lastFood = fid;
  state.lastUnit = unit;
  DB.logs.push({ id: uid(), date: state.date, meal: state.meal, foodId: fid, unit, qty });
  saveDB();
  render();
  toast('已添加');
}
/* 不进食物库，直接按填写的蛋白/碳水记一条 */
function addCustomLog(){
  const nameEl = $('c-name'), pEl = $('c-p'), cEl = $('c-c');
  const name = ((nameEl && nameEl.value) || '').trim();
  const pv = parseFloat(pEl ? pEl.value : '');
  const cv = parseFloat(cEl ? cEl.value : '');
  const p = isNaN(pv) ? 0 : pv;
  const c = isNaN(cv) ? 0 : cv;
  if (!name) return toast('请填写食物名称');
  if (p <= 0 && c <= 0) return toast('请填写蛋白质或碳水含量');
  DB.logs.push({
    id: uid(), date: state.date, meal: state.meal,
    foodId: '', name: name.slice(0, 30), p: r1(p), c: r1(c), qty: 1, unit: '份', custom: true
  });
  saveDB();
  render();
  toast('已添加');
}
function delLog(id){
  DB.logs = DB.logs.filter(l => l.id !== id);
  saveDB();
  render();
}

function toggleDone(){

  saveDB(); render();

  const i = w.parts.indexOf(p);

    '<div class="modal-head"><h3>目标设置 · ' + md(state.date) + '</h3><button class="x" onclick="closeModal()">×</button></div>'
    + '<div class="modal-body">'
    +   '<div class="field"><label>体重（kg）</label><input id="m-kg" type="number" inputmode="decimal" step="0.1" min="20" value="' + (t.wFrom ? t.kg : '') + '" placeholder="如 60.5"></div>'

    +   '<div class="field"><label>蛋白质系数（g / kg 体重）</label><input id="m-p" type="number" inputmode="decimal" step="0.1" min="0" value="' + (t.cFrom ? t.cp : '') + '" placeholder="如 1.8"></div>'
    +   '<div class="field"><label>碳水系数（g / kg 体重）</label><input id="m-c" type="number" inputmode="decimal" step="0.1" min="0" value="' + (t.cFrom ? t.cc : '') + '" placeholder="如 5"></div>'
    +   '<div class="notice">系数同样从该日期起生效。参考范围：蛋白 1.6–2.2，碳水 4–6。</div>'
    + '</div>'
    + '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveGoal()">保存</button></div>'
  );
}
function saveGoal(){
  const kg = parseFloat($('m-kg').value);
  const p = parseFloat($('m-p').value);
  const c = parseFloat($('m-c').value);
  if (!(kg > 0)) return toast('请输入体重');
  if (!(p > 0) || !(c > 0)) return toast('请输入蛋白质系数和碳水系数');

  const w = DB.weights.find(x => x.date === state.date);
  if (w) w.kg = kg; else DB.weights.push({ date: state.date, kg });

  const cur = coefRec(state.date);
  const same = cur && Number(cur.p) === p && Number(cur.c) === c;
  if (!same) {
    const ce = DB.coefs.find(x => x.date === state.date);
    if (ce) { ce.p = p; ce.c = c; } else DB.coefs.push({ date: state.date, p, c });
  }
  DB.weights.sort((a,b) => a.date < b.date ? -1 : 1);
  DB.coefs.sort((a,b) => a.date < b.date ? -1 : 1);
  saveDB(); closeModal(); render();
  toast('已保存，目标已更新');
}

let draftUnits = [];
let editingFoodId = null;

function openFoodModal(id){
  editingFoodId = id || null;
  const f = id ? DB.foods.find(x => x.id === id) : null;
  draftUnits = f ? JSON.parse(JSON.stringify(f.units)) : [{ name: '100g', p: 0, c: 0 }];
  openModal(
    '<div class="modal-head"><h3>' + (f ? '编辑食物' : '新增食物') + '</h3><button class="x" onclick="closeModal()">×</button></div>'
    + '<div class="modal-body">'
    +   '<div class="field"><label>食物名称</label><input id="f-name" type="text" value="' + (f ? esc(f.name) : '') + '" placeholder="如 鸡胸肉"></div>'
    +   '<div class="sub-t"><span>单位与营养（每 1 个单位的含量）</span><button class="btn ghost small" onclick="addUnitRow()">+ 单位</button></div>'
    +   '<div class="unit-head"><span>单位</span><span>蛋白质 g</span><span>碳水 g</span><span></span></div>'
    +   '<div id="unit-rows"></div>'
    +   '<div class="notice">例：鸡蛋 → 「1个」蛋白 6 / 碳水 0.6；「100g」蛋白 13 / 碳水 1.3。录入时按你选的单位换算。</div>'
    + '</div>'
    + '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveFood()">保存</button></div>'
  );
  renderUnitRows();
}
function renderUnitRows(){
  const box = $('unit-rows');
  if (!box) return;
  box.innerHTML = draftUnits.map((u, i) =>
    '<div class="unit-row">'
    + '<input type="text" value="' + esc(u.name) + '" placeholder="单位" oninput="draftUnits[' + i + '].name=this.value">'
    + '<input type="number" step="0.1" value="' + u.p + '" placeholder="蛋白g" oninput="draftUnits[' + i + '].p=parseFloat(this.value)||0">'
    + '<input type="number" step="0.1" value="' + u.c + '" placeholder="碳水g" oninput="draftUnits[' + i + '].c=parseFloat(this.value)||0">'
    + '<button class="del" onclick="delUnitRow(' + i + ')">×</button>'
    + '</div>'
  ).join('');
}
function addUnitRow(){ draftUnits.push({ name: '', p: 0, c: 0 }); renderUnitRows(); }
function delUnitRow(i){ draftUnits.splice(i, 1); if (!draftUnits.length) draftUnits.push({ name: '', p: 0, c: 0 }); renderUnitRows(); }

function saveFood(){
  const name = $('f-name').value.trim();
  if (!name) return toast('请输入食物名称');
  const units = draftUnits
    .filter(u => u.name && u.name.trim())
    .map(u => ({ name: u.name.trim(), p: Number(u.p) || 0, c: Number(u.c) || 0 }));
  if (!units.length) return toast('至少填一个单位');
  if (editingFoodId) {
    const f = DB.foods.find(x => x.id === editingFoodId);
    f.name = name; f.units = units;
  } else {
    DB.foods.push({ id: uid(), name, units });
  }
  saveDB(); closeModal(); render();
  toast('已保存');
}
function delFood(id){
  const f = DB.foods.find(x => x.id === id);
  const used = DB.logs.filter(l => l.foodId === id).length;
  if (!confirm('删除「' + (f ? f.name : '') + '」？' + (used ? '\n已有 ' + used + ' 条饮食记录引用它，删除后这些记录的营养值不再计入。' : ''))) return;
  DB.foods = DB.foods.filter(x => x.id !== id);
  saveDB(); render();
}

/* ============================================================
   统计
   ============================================================ */
function statsView(){
  const days = daysBetween(state.from, state.to);

  return ''
    + '<section class="sec" style="margin-top:12px">'
    +   '<div class="sec-head"><h3>统计区间</h3><span class="hint">四个图共用</span></div>'
    +   '<div class="sec-body">'
    +     '<div class="range">'
    +       '<input type="date" value="' + state.from + '" min="' + TRACK_START + '" onchange="setRangeFrom(this.value)">'
    +       '<span style="color:var(--text2)">至</span>'
    +       '<input type="date" value="' + state.to + '" onchange="setRangeTo(this.value)">'
    +     '</div>'
    +   '</div>'
    + '</section>'
    + nutritionBlock(days)
    + workoutBlock(days)
    + sleepBlock(days)
    + weightBlock(days);
}
function setRangeFrom(v){ if (!v) return; if (v < TRACK_START) v = TRACK_START; if (v > state.to) state.to = v; state.from = v; render(); }
function setRangeTo(v){ if (!v) return; if (v < TRACK_START) v = TRACK_START; if (v < state.from) state.from = v; state.to = v; render(); }

/* ---------- 图 1：营养 ---------- */
function nutritionBlock(days){
  const mode = state.nutriMode || 'p';
  const isP = mode === 'p';
  const name = isP ? '蛋白质' : '碳水';
  const data = days.map(d => {
    const t = target(d), i = intake(d);
    return { d, tar: isP ? t.tp : t.tc, act: isP ? i.p : i.c };
  });
  const n = days.length;
  const sumAct = data.reduce((s, x) => s + x.act, 0);
  const sumTar = data.reduce((s, x) => s + x.tar, 0);
  const rate = sumTar > 0 ? Math.round(sumAct / sumTar * 100) : 0;
  const dayAct = n ? r1(sumAct / n) : 0;
  const dayTar = n ? r1(sumTar / n) : 0;
  const dayGap = r1(dayTar - dayAct);
  const dayGapRate = dayTar > 0 ? Math.round(dayGap / dayTar * 100) : 0;

  return ''
    + '<section class="sec">'
    +   '<div class="sec-head"><h3>① ' + name + '</h3><span class="hint">' + n + ' 天</span></div>'
    +   '<div class="sec-body">'
    +     '<div class="quicks" style="margin-top:0">'
    +       '<button class="' + (isP ? 'on' : '') + '" onclick="setNutriMode(\'p\')">蛋白质</button>'
    +       '<button class="' + (isP ? '' : 'on') + '" onclick="setNutriMode(\'c\')">碳水</button>'
    +     '</div>'
    +     '<div class="sum-grid">'
    +       '<div class="sum"><div class="t">总' + name + '</div><div class="v">' + fmt(sumAct, 0) + ' / ' + fmt(sumTar, 0) + ' <span style="font-size:12px;color:var(--text2)">g</span></div><div class="s">达成率 ' + rate + '%</div></div>'
    +       '<div class="sum"><div class="t">日均' + name + '</div><div class="v">' + fmt(dayAct, 0) + ' / ' + fmt(dayTar, 0) + ' <span style="font-size:12px;color:var(--text2)">g</span></div><div class="s">日均缺口 ' + fmt(dayGap, 1) + ' g / 缺口率 ' + dayGapRate + '%</div></div>'
    +     '</div>'
    +     '<div class="legend">'
    +       '<span><i class="lg-dash" style="border-color:' + PALETTE.target + ';border-width:2px"></i>' + name + '目标</span>'
    +       '<span><i style="background:' + (isP ? PALETTE.p : PALETTE.c) + '"></i>' + name + '实际</span>'
    +     '</div>'
    +     '<div class="chart-box">' + chartNutrition(data, mode) + '</div>'
    +     '<div class="card-sub" style="margin-top:4px">红色虚线为目标，柱形为实际；柱顶上方数字为当日差值＝目标−实际，负数（红）表示还差，正数（黑）表示已超出；未记录饮食的日期实际值按 0 计。</div>'
    +   '</div>'
    + '</section>';
}
function setNutriMode(m){ state.nutriMode = m; render(); }

function chartNutrition(data, mode){
  if (!data.length) return emptyChart('区间内没有数据');
  const isP = mode !== 'c';
  const barColor = isP ? PALETTE.p : PALETTE.c;
  const lineColor = PALETTE.target;

  let maxV = Math.max(20, ...data.flatMap(x => [x.tar, x.act]));
  maxV = Math.ceil(maxV / 20) * 20;

  const W = Math.max(660, data.length * 54 + 84), H = 320;
  const P = { l: 46, r: 14, t: 30, b: 54 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const gw = pw / data.length;
  const bw = Math.max(6, Math.min(30, gw * 0.5));
  const y = v => P.t + ph - (v / maxV) * ph;
  const base = P.t + ph;
  const cxOf = i => P.l + gw * i + gw / 2;
  const step = Math.ceil(data.length / 10);
  const size = svgSize(W, H);

  let s = '<svg ' + size + ' xmlns="http://www.w3.org/2000/svg" font-family="inherit">';
  // 网格
  for (let i = 0; i <= 4; i++) {
    const v = maxV * i / 4, yy = y(v);
    s += '<line x1="' + P.l + '" y1="' + yy + '" x2="' + (W - P.r) + '" y2="' + yy + '" stroke="' + PALETTE.grid + '" stroke-width="1"/>';
    s += '<text x="' + (P.l - 8) + '" y="' + (yy + 3.5) + '" font-size="10" fill="' + PALETTE.label + '" text-anchor="end">' + Math.round(v) + '</text>';
  }

  // 实际柱
  data.forEach((x, i) => {
    const cx = cxOf(i), ay = y(x.act), h = Math.max(0, base - ay);
    s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + ay.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + barColor + '"/>';
  });

  // 目标：红色虚线折线（加粗）
  let path = '';
  data.forEach((x, i) => { path += (i ? 'L' : 'M') + cxOf(i).toFixed(1) + ' ' + y(x.tar).toFixed(1) + ' '; });
  s += '<path d="' + path + '" fill="none" stroke="' + lineColor + '" stroke-width="2.8" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>';

  // 柱顶上方标注差值（目标 − 实际）：还差→红色负数，超出→黑色正数
  data.forEach((x, i) => {
    const gap = r1(x.tar - x.act);
    const txt = gap > 0 ? '-' + Math.round(gap) : gap < 0 ? '+' + Math.round(-gap) : '0';
    const col = gap > 0 ? PALETTE.target : PALETTE.strong;
    const ty = y(x.act) - 7;
    s += '<text x="' + cxOf(i).toFixed(1) + '" y="' + ty.toFixed(1) + '" font-size="9.5" font-weight="700" fill="' + col + '" stroke="#fff" stroke-width="2.4" paint-order="stroke" text-anchor="middle">' + txt + '</text>';
  });

  // X 轴
  data.forEach((x, i) => {
    if (i % step !== 0) return;
    s += '<text x="' + cxOf(i).toFixed(1) + '" y="' + (base + 16) + '" font-size="9.5" fill="' + PALETTE.label + '" text-anchor="middle">' + md(x.d) + '</text>';
  });
  s += '<line x1="' + P.l + '" y1="' + base + '" x2="' + (W - P.r) + '" y2="' + base + '" stroke="' + PALETTE.axis + '" stroke-width="1"/>';
  s += '</svg>';
  return s;
}

/* ---------- 图 2：锻炼 ---------- */
function workoutBlock(days){
  const counts = {};
  PARTS.forEach(p => counts[p] = 0);
  const daily = days.map(d => {
    const w = workoutOf(d);
    const parts = (w && w.done) ? w.parts.filter(p => PARTS.indexOf(p) >= 0) : [];
    parts.forEach(p => counts[p]++);
    return { d, parts, done: !!(w && w.done) };
  });
  const n = days.length;
  // 周口径：周日为一周起点（周日至周六），统计周期跨越的总周数，不足一周按一周计
  const sunOf = str => { const x = new Date(str + 'T00:00:00'); x.setDate(x.getDate() - x.getDay()); return x; };
  const weeks = Math.max(1, Math.round((sunOf(state.to) - sunOf(state.from)) / 604800000) + 1);
  const total = PARTS.reduce((s,p) => s + counts[p], 0);
  const restDays = daily.filter(x => !x.done).length;

  // 最近一次各部位
  const lastDate = {};
  PARTS.forEach(p => {
    for (let i = days.length - 1; i >= 0; i--) {
      if (daily[i].parts.indexOf(p) >= 0) { lastDate[p] = daily[i].d; break; }
    }
  });

  const rows = PARTS.map(p => {
    const c = counts[p];
    const freq = c > 0 ? (c / weeks) : 0;
    const gap = c > 0 ? (n / c) : null;
    const last = lastDate[p] ? md(lastDate[p]) : '—';
    return '<tr><td><span class="dot" style="background:' + PART_COLORS[p] + '"></span>' + p + '</td>'
      + '<td>' + c + '</td>'
      + '<td>' + (c ? fmt(freq, 1) : '—') + '</td>'
      + '<td>' + (gap ? fmt(gap, 1) : '—') + '</td>'
      + '<td>' + last + '</td></tr>';
  }).join('');

  return ''
    + '<section class="sec">'
    +   '<div class="sec-head"><h3>② 锻炼</h3><span class="hint">共 ' + total + ' 次 · 休息 ' + restDays + ' 天 · ' + weeks + ' 周</span></div>'
    +   '<div class="sec-body">'
    +     '<div class="legend">' + PARTS.map(p => '<span><i style="background:' + PART_COLORS[p] + '"></i>' + p + '</span>').join('') + '</div>'
    +     '<div class="chart-box">' + chartWorkout(daily) + '</div>'
    +     '<table class="tbl"><thead><tr><th>部位</th><th>次数</th><th>频次(次/周)</th><th>间隔(天)</th><th>最近</th></tr></thead><tbody>' + rows + '</tbody></table>'
    +     '<div class="card-sub" style="margin-top:6px">图中每行一个部位、每列一天，圆点表示当天练了该部位。频次 = 周期内总次数 ÷ 总周数，周以周日到周六计，不足一周按一周算（本期 ' + weeks + ' 周）；间隔天数 = 统计天数 ÷ 该部位次数。</div>'
    +   '</div>'
    + '</section>';
}

function chartWorkout(daily){
  if (!daily.length) return emptyChart('区间内没有数据');
  const W = Math.max(660, daily.length * 26 + 84), H = 7 * 28 + 62;
  const P = { l: 62, r: 16, t: 14, b: 42 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const gw = pw / daily.length;
  const rowH = ph / PARTS.length;
  const dotR = Math.max(3.5, Math.min(9, Math.min(gw, rowH) * 0.33));
  const step = Math.ceil(daily.length / 12);
  const size = svgSize(W, H);

  let s = '<svg ' + size + ' xmlns="http://www.w3.org/2000/svg">';
  // 每个部位一行
  PARTS.forEach((p, idx) => {
    const cy = P.t + rowH * idx + rowH / 2;
    s += '<line x1="' + P.l + '" y1="' + cy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + cy.toFixed(1) + '" stroke="' + PALETTE.grid + '"/>';
    s += '<text x="' + (P.l - 8) + '" y="' + (cy + 3.5).toFixed(1) + '" font-size="10.5" fill="' + PALETTE.strong + '" text-anchor="end">' + p + '</text>';
  });
  // 每天练到的部位打点
  daily.forEach((x, i) => {
    const cx = P.l + gw * i + gw / 2;
    x.parts.forEach(p => {
      const idx = PARTS.indexOf(p);
      if (idx < 0) return;
      const cy = P.t + rowH * idx + rowH / 2;
      s += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + dotR.toFixed(1) + '" fill="' + PART_COLORS[p] + '"/>';
    });
    if (i % step === 0) {
      s += '<text x="' + cx.toFixed(1) + '" y="' + (P.t + ph + 18) + '" font-size="9.5" fill="' + PALETTE.label + '" text-anchor="middle">' + md(x.d) + '</text>';
    }
  });
  s += '<line x1="' + P.l + '" y1="' + (P.t + ph).toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + (P.t + ph).toFixed(1) + '" stroke="' + PALETTE.axis + '"/>';
  s += '</svg>';
  return s;
}

/* ---------- 图 3：睡眠 ---------- */
const bedMins = s => {
  let m = s.bedH * 60 + s.bedM;
  if (m < 720) m += 1440;   // 以 12:00 为界展开到次日
  return m;
};
function clockLabel(m){
  const x = ((Math.round(m) % 1440) + 1440) % 1440;
  return pad2(Math.floor(x / 60)) + ':' + pad2(x % 60);
}
function circularAvgMins(list){
  if (!list.length) return null;
  let x = 0, y = 0;
  list.forEach(m => { const a = (m / 1440) * Math.PI * 2; x += Math.cos(a); y += Math.sin(a); });
  let ang = Math.atan2(y, x);
  if (ang < 0) ang += Math.PI * 2;
  return Math.round(ang / (Math.PI * 2) * 1440) % 1440;
}

function sleepBlock(days){
  const recs = days.map(d => ({ d, s: sleepOf(d) })).filter(x => x.s);
  const beds = recs.map(x => bedMins(x.s));
  const durs = recs.map(x => Number(x.s.durH) || 0);
  const avgBed = circularAvgMins(beds);
  const avgDur = durs.length ? durs.reduce((a,b) => a + b, 0) / durs.length : 0;

  const stat = recs.length
    ? '<div class="sum-grid">'
      + '<div class="sum"><div class="t">平均入睡</div><div class="v">' + (avgBed != null ? clockLabel(avgBed) : '—') + '</div><div class="s">按环形平均计算</div></div>'
      + '<div class="sum"><div class="t">平均时长</div><div class="v">' + fmt(avgDur, 1) + ' <span style="font-size:12px;color:var(--text2)">小时</span></div><div class="s">共 ' + recs.length + ' 天有记录</div></div>'
      + '</div>'
    : '';

  return ''
    + '<section class="sec">'
    +   '<div class="sec-head"><h3>③ 睡眠</h3><span class="hint">' + recs.length + ' / ' + days.length + ' 天有记录</span></div>'
    +   '<div class="sec-body">'
    +     stat
    +     '<div class="legend">'
    +       '<span><i style="background:' + PALETTE.sleep + '"></i>入睡时刻</span>'
    +       '<span><i style="background:' + PALETTE.sleepBar + '"></i>睡眠时长</span>'
    +       '<span><i style="background:' + PALETTE.mean + '"></i>均值线</span>'
    +     '</div>'
    +     '<div class="chart-box">' + chartSleep(days) + '</div>'
    +     '<div class="card-sub" style="margin-top:4px">入睡时刻按「开始睡觉所在日期」归属；跨零点（23:30 → 01:00）在同一连续轴上显示。</div>'
    +   '</div>'
    + '</section>';
}

function chartSleep(days){
  const pts = days.map(d => ({ d, s: sleepOf(d) }));
  const has = pts.filter(x => x.s);
  if (!has.length) return emptyChart('区间内还没有睡眠记录');

  const ms = has.map(x => bedMins(x.s));
  let lo = Math.min(...ms), hi = Math.max(...ms);
  if (hi - lo < 180) { const mid = (lo + hi) / 2; lo = mid - 90; hi = mid + 90; }
  lo = Math.floor(lo / 30) * 30 - 30;
  hi = Math.ceil(hi / 30) * 30 + 30;

  const maxDur = Math.max(6, Math.ceil(Math.max(...has.map(x => Number(x.s.durH) || 0))));
  const W = Math.max(640, days.length * 44 + 80), H = 300;
  const P = { l: 48, r: 44, t: 16, b: 48 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const gw = pw / days.length;
  const bw = Math.max(6, Math.min(22, gw * 0.42));
  const yT = m => P.t + (m - lo) / (hi - lo) * ph;          // 时刻：早在上
  const yD = v => P.t + ph - (v / maxDur) * ph;             // 时长：从底向上
  const step = Math.ceil(days.length / 12);
  const labStep = days.length <= 16 ? 1 : step;   // 天数多时间隔标值，避免重叠
  const size = svgSize(W, H);

  let s = '<svg ' + size + ' xmlns="http://www.w3.org/2000/svg">';

  // 左轴：入睡时刻刻度
  const range = hi - lo;
  const tickStep = range <= 180 ? 30 : range <= 360 ? 60 : range <= 720 ? 120 : 180;
  for (let m = Math.ceil(lo / tickStep) * tickStep; m <= hi; m += tickStep) {
    const yy = yT(m);
    s += '<line x1="' + P.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + yy.toFixed(1) + '" stroke="' + PALETTE.grid + '"/>';
    s += '<text x="' + (P.l - 7) + '" y="' + (yy + 3.5).toFixed(1) + '" font-size="10" fill="' + PALETTE.label + '" text-anchor="end">' + clockLabel(m) + '</text>';
  }
  // 右轴：时长
  for (let i = 0; i <= maxDur; i += (maxDur > 8 ? 2 : 1)) {
    const yy = yD(i);
    s += '<text x="' + (W - P.r + 7) + '" y="' + (yy + 3.5).toFixed(1) + '" font-size="10" fill="' + PALETTE.mean + '" text-anchor="start">' + i + 'h</text>';
  }

  // 时长柱
  pts.forEach((x, i) => {
    if (!x.s) return;
    const cx = P.l + gw * i + gw / 2;
    const v = Number(x.s.durH) || 0;
    const yy = yD(v);
    s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (P.t + ph - yy).toFixed(1) + '" rx="2" fill="' + PALETTE.sleepBar + '"/>';
    if (i % labStep === 0) {
      s += '<text x="' + cx.toFixed(1) + '" y="' + (yy - 5).toFixed(1) + '" font-size="10" font-weight="600" fill="' + PALETTE.sleepLab + '" stroke="#fff" stroke-width="2.6" paint-order="stroke" text-anchor="middle">' + fmt(v, 1) + 'h</text>';
    }
  });

  // 入睡折线（无记录断开）
  let path = '', prev = false;
  pts.forEach((x, i) => {
    if (!x.s) { prev = false; return; }
    const cx = P.l + gw * i + gw / 2;
    const cy = yT(bedMins(x.s));
    path += (prev ? 'L' : 'M') + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ';
    prev = true;
  });
  if (path) s += '<path d="' + path + '" fill="none" stroke="' + PALETTE.sleep + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

  // 点
  pts.forEach((x, i) => {
    if (!x.s) return;
    const cx = P.l + gw * i + gw / 2;
    const cy = yT(bedMins(x.s));
    s += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3" fill="#fff" stroke="' + PALETTE.sleep + '" stroke-width="2"/>';
    if (i % labStep === 0) {
      s += '<text x="' + cx.toFixed(1) + '" y="' + (cy + 14).toFixed(1) + '" font-size="10" font-weight="600" fill="' + PALETTE.sleepLab + '" stroke="#fff" stroke-width="2.6" paint-order="stroke" text-anchor="middle">' + clockLabel(bedMins(x.s)) + '</text>';
    }
  });

  // 均值线
  const avgBed = circularAvgMins(ms);
  if (avgBed != null) {
    const m = avgBed < 720 ? avgBed + 1440 : avgBed;
    if (m >= lo && m <= hi) {
      const yy = yT(m);
      s += '<line x1="' + P.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + yy.toFixed(1) + '" stroke="' + PALETTE.sleep + '" stroke-width="1.2" stroke-dasharray="5 4" opacity=".55"/>';
      s += '<text x="' + (W - P.r) + '" y="' + (yy - 5).toFixed(1) + '" font-size="10" fill="' + PALETTE.sleep + '" stroke="#fff" stroke-width="2.2" paint-order="stroke" text-anchor="end">均值 ' + clockLabel(m) + '</text>';
    }
  }
  const avgDur = has.reduce((a, x) => a + (Number(x.s.durH) || 0), 0) / has.length;
  const yy2 = yD(avgDur);
  s += '<line x1="' + P.l + '" y1="' + yy2.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + yy2.toFixed(1) + '" stroke="' + PALETTE.mean + '" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/>';
  s += '<text x="' + (W - P.r) + '" y="' + (yy2 + 13).toFixed(1) + '" font-size="10" fill="' + PALETTE.mean + '" stroke="#fff" stroke-width="2.2" paint-order="stroke" text-anchor="end">均值 ' + fmt(avgDur, 1) + 'h</text>';

  // X 轴
  pts.forEach((x, i) => {
    if (i % step !== 0) return;
    const cx = P.l + gw * i + gw / 2;
    s += '<text x="' + cx.toFixed(1) + '" y="' + (P.t + ph + 16) + '" font-size="9.5" fill="' + PALETTE.label + '" text-anchor="middle">' + md(x.d) + '</text>';
  });
  s += '<line x1="' + P.l + '" y1="' + (P.t + ph) + '" x2="' + (W - P.r) + '" y2="' + (P.t + ph) + '" stroke="' + PALETTE.axis + '"/>';
  s += '</svg>';
  return s;
}

/* ---------- 图 4：体重变化 ---------- */
function weightBlock(days){
  const vals = days.map(d => {
    const w = weightRec(d);
    return { d, kg: w ? Number(w.kg) || 0 : null, rec: !!(w && w.date === d) };
  });
  const known = vals.filter(v => v.kg != null);
  const recs = DB.weights.filter(w => w.date >= state.from && w.date <= state.to)
                          .sort((a, b) => a.date < b.date ? -1 : 1);
  const first = known.length ? known[0].kg : 0;
  const last = known.length ? known[known.length - 1].kg : 0;
  const delta = r1(last - first);

  const stat = known.length
    ? '<div class="sum-grid">'
      + '<div class="sum"><div class="t">区间起始</div><div class="v">' + fmt(first, 1) + ' <span style="font-size:12px;color:var(--text2)">kg</span></div><div class="s">' + md(known[0].d) + '</div></div>'
      + '<div class="sum"><div class="t">区间最新</div><div class="v">' + fmt(last, 1) + ' <span style="font-size:12px;color:var(--text2)">kg</span></div><div class="s">' + md(known[known.length - 1].d) + '</div></div>'
      + '<div class="sum"><div class="t">区间变化</div><div class="v">' + (delta > 0 ? '+' : '') + fmt(delta, 1) + ' <span style="font-size:12px;color:var(--text2)">kg</span></div><div class="s">区间内称重 ' + recs.length + ' 次</div></div>'
      + '</div>'
    : '';

  return ''
    + '<section class="sec">'
    +   '<div class="sec-head"><h3>④ 体重变化</h3><span class="hint">' + recs.length + ' 次称重</span></div>'
    +   '<div class="sec-body">'
    +     stat
    +     '<div class="legend">'
    +       '<span><i style="background:' + PALETTE.weight + '"></i>体重（每日生效值）</span>'
    +       '<span><i style="background:' + PALETTE.warm + ';border-radius:50%"></i>称重日</span>'
    +     '</div>'
    +     '<div class="chart-box">' + chartWeight(vals) + '</div>'
    +     '<div class="card-sub" style="margin-top:4px">数据来自「体重记录」：未称重的日期沿用上一条记录，折线保持水平；你录入新体重的当天才会跳变，且只影响当天及以后。</div>'
    +   '</div>'
    + '</section>';
}

function chartWeight(vals){
  const pts = vals.filter(v => v.kg != null);
  if (!pts.length) return emptyChart('区间内还没有体重记录');

  const kgs = pts.map(p => p.kg);
  let lo = Math.min(...kgs), hi = Math.max(...kgs);
  if (hi - lo < 1) { const mid = (lo + hi) / 2; lo = mid - 0.5; hi = mid + 0.5; }
  const pd = (hi - lo) * 0.28;
  lo = Math.floor((lo - pd) * 10) / 10;
  hi = Math.ceil((hi + pd) * 10) / 10;

  const W = Math.max(640, vals.length * 46 + 80), H = 268;
  const P = { l: 48, r: 18, t: 26, b: 50 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const gw = pw / vals.length;
  const x = i => P.l + gw * i + gw / 2;
  const y = v => P.t + ph - (v - lo) / (hi - lo) * ph;
  const base = P.t + ph;
  const step = Math.ceil(vals.length / 12);
  const size = svgSize(W, H);

  let s = '<svg ' + size + ' xmlns="http://www.w3.org/2000/svg">';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = y(v);
    s += '<line x1="' + P.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + yy.toFixed(1) + '" stroke="' + PALETTE.grid + '"/>';
    s += '<text x="' + (P.l - 8) + '" y="' + (yy + 3.5).toFixed(1) + '" font-size="10" fill="' + PALETTE.label + '" text-anchor="end">' + v.toFixed(1) + '</text>';
  }

  // 阶梯折线：沿用值保持水平，录入新体重的当天垂直跳变
  const segs = [];
  let cur = null;
  vals.forEach((v, i) => {
    if (v.kg == null) { cur = null; return; }
    if (!cur) { cur = []; segs.push(cur); }
    cur.push([i, v.kg]);
  });
  segs.forEach(seg => {
    let d = '';
    seg.forEach(([i, kg], k) => {
      if (k === 0) { d += 'M' + x(i).toFixed(1) + ' ' + y(kg).toFixed(1); return; }
      const pk = seg[k - 1][1];
      d += ' L' + x(i).toFixed(1) + ' ' + y(pk).toFixed(1) + ' L' + x(i).toFixed(1) + ' ' + y(kg).toFixed(1);
    });
    s += '<path d="' + d + '" fill="none" stroke="' + PALETTE.weight + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  });

  // 点：称重日实心并标数值
  const recCount = vals.filter(v => v.rec).length;
  vals.forEach((v, i) => {
    if (v.kg == null) return;
    const cx = x(i), cy = y(v.kg);
    if (v.rec) {
      s += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3.6" fill="' + PALETTE.warm + '" stroke="#fff" stroke-width="1.4"/>';
      if (recCount <= 12 || i % step === 0) {
        s += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 8).toFixed(1) + '" font-size="9" font-weight="600" fill="' + PALETTE.warm + '" text-anchor="middle">' + fmt(v.kg, 1) + '</text>';
      }
    } else {
      s += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="2" fill="#fff" stroke="' + PALETTE.weight + '" stroke-width="1.4"/>';
    }
    if (i % step === 0) {
      s += '<text x="' + cx.toFixed(1) + '" y="' + (base + 16) + '" font-size="9.5" fill="' + PALETTE.label + '" text-anchor="middle">' + md(v.d) + '</text>';
    }
  });
  s += '<line x1="' + P.l + '" y1="' + base + '" x2="' + (W - P.r) + '" y2="' + base + '" stroke="' + PALETTE.axis + '"/>';
  s += '</svg>';
  return s;
}

function emptyChart(msg){
  return '<div class="empty" style="padding:40px 0">' + msg + '</div>';
}

/* 宽度够用时铺满容器，点数多时保留固定宽度并横向滚动 */
function svgSize(w, h){
  if (w <= 760) return 'viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="display:block"';
  return 'viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" style="display:block"';
}

function importJSON(input){

  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || typeof d !== 'object') throw new Error('格式不正确');
      if (!confirm('导入将覆盖当前数据，确定继续？')) return;
      const keep = { gistId: DB.settings.gistId, gistToken: DB.settings.gistToken };

  };

/* ============================================================
   Gist 同步
   ============================================================ */
const GIST_FILE = 'nutrition-data.json';
const GIST_DESC = '增重营养记录数据同步';
let syncBusy = false, syncAgain = false, lastSyncAt = null;

function gistHeaders(){
  return {
    'Authorization': 'Bearer ' + DB.settings.gistToken,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function gistErr(code){
  if (code === 401) return 'Token 无效或已过期（401）';
  if (code === 403) return 'Token 缺少 gist 权限（403）';
  if (code === 404) return '找不到 Gist（404）';
  return 'HTTP ' + code;
}
function syncPayload(){
  const clean = JSON.parse(JSON.stringify(DB));
  clean.settings = { autoSync: !!DB.settings.autoSync };
  clean.syncedAt = new Date().toISOString();
  return clean;
}

function setSyncMsg(msg, cls){
  const st = $('gist-status');
  if (st) { st.textContent = msg; st.style.color = cls === 'err' ? 'var(--warn)' : (cls === 'ok' ? 'var(--ok)' : ''); }
  const dot = $('sync-dot');
  if (dot) dot.className = 'sync-dot ' + (cls || '');
}

/* 没记 Gist ID 时，按 description 在自己的 gist 里找回来（手机端只需填 Token） */
async function findGistId(){
  const res = await fetch('https://api.github.com/gists?per_page=100', { headers: gistHeaders(), cache: 'no-store' });
  if (!res.ok) throw new Error(gistErr(res.status));
  const list = await res.json();
  const hit = (list || []).find(g => g.description === GIST_DESC && g.files && g.files[GIST_FILE]);
  return hit ? hit.id : null;
}

async function pullRemote(){
  if (!DB.settings.gistId) {
    const id = await findGistId();
    if (!id) return null;
    DB.settings.gistId = id;
    saveLocal();
  }
  const res = await fetch('https://api.github.com/gists/' + DB.settings.gistId, { headers: gistHeaders(), cache: 'no-store' });
  if (res.status === 404) { DB.settings.gistId = ''; return null; }
  if (!res.ok) throw new Error(gistErr(res.status));
  const data = await res.json();
  const f = data.files && data.files[GIST_FILE];
  if (!f || !f.content) return null;
  try { return JSON.parse(f.content); } catch(e){ return null; }
}

async function pushRemote(){
  const payload = { description: GIST_DESC, public: false, files: {} };
  payload.files[GIST_FILE] = { content: JSON.stringify(syncPayload(), null, 2) };
  let url = 'https://api.github.com/gists', method = 'POST';
  if (DB.settings.gistId) { url += '/' + DB.settings.gistId; method = 'PATCH'; }
  const res = await fetch(url, { method, headers: gistHeaders(), body: JSON.stringify(payload) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || gistErr(res.status));
  if (!DB.settings.gistId && data.id) DB.settings.gistId = data.id;
  saveLocal();
}

/* 一次同步 = 拉取 → 按记录合并 → 有差异就推送 */
async function syncNow(silent){
  if (!DB.settings.gistToken) {
    setSyncMsg('未连接', '');
    if (!silent) toast('请先填写 GitHub Token');
    return false;
  }
  if (syncBusy) { syncAgain = true; return false; }
  syncBusy = true;
  setSyncMsg('同步中…');
  try {
    const remote = await pullRemote();
    stampChanges();
    const changed = mergeRemote(remote);
    let stored = false;
    if (changed) { saveLocal(); if (!document.querySelector('.mask')) { render(); } }
    if (!remote || normData(syncPayload()) !== normData(remote)) {
      await pushRemote();
      stored = true;
    } else {
      saveLocal();
    }
    lastSyncAt = Date.now();
    setSyncMsg('已同步 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), 'ok');
    if (!silent) toast(changed ? (stored ? '已合并并同步' : '已拉取最新数据') : '已是最新');
    return true;
  } catch(e) {
    setSyncMsg('同步失败：' + e.message, 'err');
    if (!silent) toast('同步失败：' + e.message);
    return false;
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; setTimeout(() => syncNow(true), 600); }
  }
}

function syncToGist(){ return syncNow(false); }
function syncFromGist(){ return syncNow(false); }

/* ============================================================
   弹窗 / toast
   ============================================================ */
function openModal(html){
  $('modal-root').innerHTML = '<div class="mask" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">' + html + '</div></div>';
}
function closeModal(){ $('modal-root').innerHTML = ''; }
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ============================================================
   启动
   ============================================================ */
(function init(){
  snap = buildSnap();
  // 支持通过 URL 参数快速带凭据（手机端加到桌面时更方便）
  const q = new URLSearchParams(location.search);
  if (q.get('gist')) DB.settings.gistId = q.get('gist');
  if (q.get('token')) { DB.settings.gistToken = q.get('token'); DB.settings.autoSync = true; saveLocal(); }
  render();
  if (DB.settings.gistToken && DB.settings.autoSync) syncNow(true);

  // 手机切回前台 / 重新联网时自动拉最新
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && DB.settings.gistToken && DB.settings.autoSync) {
      if (!lastSyncAt || Date.now() - lastSyncAt > 20000) syncNow(true);
    }
  });
  window.addEventListener('online', () => {
    if (DB.settings.gistToken && DB.settings.autoSync) syncNow(true);
  });
})();
</script>
